<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockBuddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧱%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f1ff; --panel: #ffffff; --ink: #2b2350; --soft: #6b648f; --line: #e3defa;
    --brand: #7c5cff; --brand-2: #ede9ff; --accent: #ff7a59; --good: #22c55e; --danger: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17132b; --panel: #221c3d; --ink: #f1edff; --soft: #a9a1d1; --line: #35305a; --brand-2: #332c63; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 600 15px/1.35 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: 230px 1fr 250px; grid-template-rows: 58px 1fr; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel);
    border-bottom: 2px solid var(--line); }
  header .logo { font-size: 20px; font-weight: 800; margin-right: 4px; white-space: nowrap; }
  header .sp { flex: 1; }
  header input#projName { width: 150px; }
  aside { background: var(--panel); padding: 12px; overflow-y: auto; border-right: 2px solid var(--line); }
  #right { border-right: 0; border-left: 2px solid var(--line); }
  h3 { margin: 14px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
  h3:first-child { margin-top: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--panel);
    border-radius: 14px; padding: 8px 12px; transition: transform .08s, background .15s; }
  button:hover:not(:disabled) { background: var(--brand-2); }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; }
  button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  input[type=text], input:not([type]) { font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line);
    border-radius: 12px; padding: 7px 10px; width: 100%; }
  button.on:hover:not(:disabled) { background: var(--brand); }
  .tab { padding: 8px 16px; font-weight: 800; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; font-size: 12px; }
  .tile span { font-size: 26px; line-height: 1; }
  .tile.big { padding: 14px 6px; font-size: 15px; } .tile.big span { font-size: 44px; }
  .mini { padding: 6px 0; font-size: 18px; line-height: 1; }
  .sec { margin-top: 14px; padding-top: 10px; border-top: 2px dashed var(--line); }
  .sec > b { display: block; margin-bottom: 6px; }
  .tip { color: var(--soft); font-size: 13px; margin: 6px 0; font-weight: 600; } .tip.small { font-size: 12px; }
  .check { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; font-size: 14px; }
  .check input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--brand); }
  input[type=color] { width: 48px; height: 32px; border: 2px solid var(--line); border-radius: 10px; padding: 0; background: none; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line); }
  .sw.on { box-shadow: 0 0 0 3px var(--brand); } .sw:hover:not(:disabled) { background: inherit; filter: brightness(1.1); }
  .pats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .pat { position: relative; padding: 0; overflow: hidden; aspect-ratio: 1; border-radius: 10px; }
  .pat img { width: 100%; height: 100%; display: block; object-fit: cover; image-rendering: auto; }
  .pat i { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-style: normal; background: rgba(0,0,0,.55); color: #fff; padding: 1px 0; }
  .pat.on { box-shadow: 0 0 0 3px var(--brand); background: var(--panel); }
  .slider { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--soft); margin: 8px 0; }
  .slider input { width: 100%; accent-color: var(--brand); }
  .wide { width: 100%; margin-top: 6px; } .row { display: flex; gap: 6px; margin-top: 14px; } .row .wide { margin: 0; }
  .soft { background: var(--bg); } .danger { color: var(--danger); }
  #toolbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    background: var(--panel); padding: 8px; border-radius: 20px; border: 2px solid var(--line); box-shadow: 0 6px 24px rgba(40,20,100,.18); max-width: calc(100% - 20px); }
  .tool { display: flex; flex-direction: column; align-items: center; min-width: 74px; padding: 6px 10px; font-size: 13px; }
  .tool span { font-size: 24px; line-height: 1.1; }
  .label { padding: 8px 12px; color: var(--soft); white-space: nowrap; }
  #viewbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #viewbar button { padding: 5px 10px; font-size: 13px; border-radius: 12px; opacity: .92; }
  #welcome { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #welcome .card { pointer-events: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 28px; padding: 22px 26px;
    text-align: center; box-shadow: 0 10px 40px rgba(40,20,100,.2); max-width: 460px; }
  #welcome h2 { margin: 0 0 14px; font-size: 24px; }
  .link { border: 0; background: none; color: var(--brand); text-decoration: underline; padding: 0; }
  .hidden { display: none !important; }
  #toast { position: fixed; top: 70px; left: 50%; transform: translate(-50%, -20px); background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 16px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 10; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .export { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 800; }
  .export:hover:not(:disabled) { background: #ff6a43; }
  @media (max-width: 900px) { #app { grid-template-columns: 170px 1fr 190px; } header input#projName { width: 90px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🧱 BlockBuddy</span>
    <input id="projName" maxlength="30" title="Name of your model" aria-label="Project name">
    <button id="undoBtn" data-act="undo" title="Undo (Ctrl/Cmd+Z)">↩️ Undo</button>
    <button id="redoBtn" data-act="redo" title="Redo">↪️</button>
    <span class="sp"></span>
    <button class="tab on" id="tab-build" data-act="mode:build">🔨 Build</button>
    <button class="tab" id="tab-pose" data-act="mode:pose">🕺 Pose</button>
    <span class="sp"></span>
    <button data-act="new" title="Start over">🆕</button>
    <button data-act="open" title="Open a saved model">📂 Open</button>
    <button data-act="save" title="Save to keep working later">💾 Save</button>
    <button class="export" data-act="export" title="Make a .glb file for your three.js game">🎮 Export for game</button>
  </header>
  <aside id="left"></aside>
  <main id="stage">
    <canvas id="c" tabindex="0"></canvas>
    <div id="viewbar">
      <button data-act="view:front">Front</button><button data-act="view:side">Side</button>
      <button data-act="view:back">Back</button><button data-act="view:top">Top</button>
      <button data-act="frame" title="Zoom to fit">🔍 Fit</button>
      <button data-act="spin" title="Spin around">🌀 Spin</button>
    </div>
    <div id="toolbar"></div>
    <div id="welcome" class="hidden"></div>
  </main>
  <aside id="right"></aside>
</div>
<div id="toast"></div>
<input type="file" id="openFile" accept=".json,application/json" hidden>
<input type="file" id="picFile" accept="image/*" hidden>
<script src="blockbuddy.js"></script>
</body>
</html>
